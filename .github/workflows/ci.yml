name: CI Verification Gate

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type and Schema Check
        run: bun run astro check

      - name: Lint Codebase
        run: bun run lint

      - name: Format Check
        run: bun run format:check

      - name: Run Test Suite
        run: bun run test

      - name: Build Production Site
        run: bun run build

      - name: Security Gate - Verify Dashboard Structurally Absent from Build Output
        run: |
          test ! -d dist/profile
          test ! -f dist/profile/index.html
          ! grep -rn "FileUploadTab" dist/
          ! grep -rn "SettingsTab" dist/
          ! grep -rn "Pomegranate Dashboard" dist/
          ! grep -rn "disconnect-github" dist/
          ! grep -rn "raw-markdown-input" dist/
